<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#0a0a0a;
background-image:radial-gradient(circle at top,#2a2a2a 0%,#0a0a0a 60%);
color:#fff;
}

.header{
padding:40px 20px;
text-align:center;
position:relative;
background:rgba(10,10,10,.85);
border-bottom:1px solid rgba(241,209,154,.15);
}

#logo{
font-size:48px;
color:#f1d19a;
letter-spacing:5px;
}

.lang-switch{
position:absolute;
top:15px;
right:15px;
display:flex;
gap:8px;
}

.lang-switch button{
background:#1b1b1b;
border:none;
color:#fff;
padding:6px 10px;
border-radius:10px;
cursor:pointer;
}

.lang-switch button.active{
background:#f1d19a;
color:#111;
font-weight:bold;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.tab{
padding:12px 22px;
border:none;
border-radius:30px;
cursor:pointer;
background:#1b1b1b;
color:#fff;
}

.tab.active{
background:linear-gradient(135deg,#f1d19a,#c9a96e);
color:#111;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.category-title{
font-size:28px;
color:#f1d19a;
margin:30px 0 15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
}

.card{
position:relative;
background:rgba(255,255,255,.04);
border:1px solid rgba(241,209,154,.12);
border-radius:18px;
padding:15px;
}

.name{font-weight:bold;font-size:18px}
.weight{font-size:12px;color:#f1d19a;margin-top:5px}

.price{
position:absolute;
top:12px;
right:12px;
background:rgba(241,209,154,.15);
border:1px solid rgba(241,209,154,.35);
color:#f1d19a;
padding:4px 8px;
border-radius:10px;
font-weight:bold;
font-size:13px;
}

.desc{color:#ccc;margin-top:10px;line-height:1.5}
</style>

/* ================= RENDER ENGINE ================= */

let lang="ru";
let activeTab="lounge";

function renderTabs(){
const tabs=document.getElementById("tabs");
tabs.innerHTML="";
ui[lang].tabs.forEach(t=>{
const btn=document.createElement("button");
btn.className="tab"+(t.id===activeTab?" active":"");
btn.textContent=t.label;
btn.onclick=()=>{activeTab=t.id;render();};
tabs.appendChild(btn);
});
}

function renderMenu(){
const app=document.getElementById("app");
app.innerHTML="";

const filtered=menu.filter(i=>i.tab===activeTab);

const grouped={};

filtered.forEach(i=>{
if(!grouped[i.cat])grouped[i.cat]=[];
grouped[i.cat].push(i);
});

Object.entries(grouped).forEach(([cat,items])=>{
const section=document.createElement("div");

const title=document.createElement("div");
title.className="category-title";
title.textContent=ui[lang].cats[cat]||cat;

const grid=document.createElement("div");
grid.className="grid";

items.forEach(item=>{
const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="name">${item.name[lang]}</div>
<div class="weight">${item.weight}</div>
<div class="price">${item.price}</div>
<div class="desc">${item.desc[lang]}</div>
`;

grid.appendChild(card);
});

section.appendChild(title);
section.appendChild(grid);
app.appendChild(section);
});
}

function render(){
document.getElementById("logo").textContent="MENUA Lounge Bar";
document.getElementById("ruBtn").classList.toggle("active",lang==="ru");
document.getElementById("enBtn").classList.toggle("active",lang==="en");

renderTabs();
renderMenu();
}

function setLang(l){lang=l;render();}

render();
