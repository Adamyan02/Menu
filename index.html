<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENUA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#0a0a0a;
background-image:radial-gradient(circle at top,#2a2a2a 0%,#0a0a0a 60%);
color:#fff;
}

.header{
padding:40px 20px;
text-align:center;
position:relative;
backdrop-filter:blur(12px);
background:rgba(10,10,10,.85);
border-bottom:1px solid rgba(241,209,154,.15);
}

#logo{
font-size:48px;
color:#f1d19a;
letter-spacing:5px;
}

.lang-switch{
position:absolute;
top:15px;
right:15px;
display:flex;
gap:8px;
}

.lang-switch button{
background:#1b1b1b;
border:none;
color:#fff;
padding:6px 10px;
border-radius:10px;
cursor:pointer;
font-size:12px;
}

.lang-switch button.active{
background:#f1d19a;
color:#111;
font-weight:bold;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.tab{
padding:12px 22px;
border:none;
border-radius:30px;
cursor:pointer;
background:#1b1b1b;
color:#fff;
}

.tab.active{
background:linear-gradient(135deg,#f1d19a,#c9a96e);
color:#111;
font-weight:bold;
}

.container{max-width:1200px;margin:auto;padding:25px}

.menu{display:none}
.menu.active{display:block}

.category-title{
font-size:30px;
color:#f1d19a;
margin:35px 0 15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:18px;
}

.card{
background:rgba(255,255,255,.04);
border:1px solid rgba(241,209,154,.12);
border-radius:22px;
padding:18px;
}

.top{display:flex;justify-content:space-between}
.name{font-weight:bold;font-size:18px}

.weight{
background:linear-gradient(135deg,#f1d19a,#c9a96e);
color:#111;
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.desc{color:#d2d2d2;margin-top:10px;line-height:1.6}
.price{margin-top:14px;color:#f1d19a;font-size:24px;font-weight:bold}

.search{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:#171717;
color:white;
margin-bottom:25px;
}
</style>
</head>

<body>

<div class="header">

<div class="lang-switch">
<button onclick="setLang('ru')" id="ruBtn" class="active">RU</button>
<button onclick="setLang('en')" id="enBtn">EN</button>
</div>

<h1 id="logo">MENUA Lounge Bar</h1>

<div class="tabs">
<button class="tab active" onclick="showMenu('lounge',this)" data-key="lounge">Lounge Bar</button>
<button class="tab" onclick="showMenu('preorder',this)" data-key="preorder">По предзаказу</button>
<button class="tab" onclick="showMenu('hotel',this)" data-key="hotel">Hotel</button>
</div>

</div>

<div class="container">

<input class="search" id="search" placeholder="Поиск блюда..." onkeyup="searchMenu(this.value)">

<div id="lounge" class="menu active">

<div class="category-title" data-key="pizza_title">🍕 Пицца</div>

<div class="grid">

<div class="card">
<div class="top">
<div class="name" data-key="pizza1_name">Пицца 4 сыра</div>
<div class="weight">500 г</div>
</div>
<div class="desc" data-key="pizza1_desc">Пармезан, Чеддер, Дор Блю, Моцарелла, сливочно-сырный соус</div>
<div class="price">600 ₽</div>
</div>

</div>

</div>

<div id="preorder" class="menu"><h2 data-key="preorder">По предзаказу</h2></div>
<div id="hotel" class="menu"><h2 data-key="hotel">Меню гостиницы</h2></div>

</div>

<script>

function showMenu(id,btn){
document.querySelectorAll('.menu').forEach(m=>m.classList.remove('active'));
document.getElementById(id).classList.add('active');

document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
btn.classList.add('active');
}

/* SEARCH */
function searchMenu(v){
v=v.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(v)?'block':'none';
});
}

/* TRANSLATIONS */
const translations = {
ru:{
search:"Поиск блюда...",
pizza_title:"🍕 Пицца",
pizza1_name:"Пицца 4 сыра",
pizza1_desc:"Пармезан, Чеддер, Дор Блю, Моцарелла, сливочно-сырный соус",
preorder:"По предзаказу",
hotel:"Меню гостиницы"
},

en:{
search:"Search dishes...",
pizza_title:"🍕 Pizza",
pizza1_name:"Four Cheese Pizza",
pizza1_desc:"Parmesan, Cheddar, Blue cheese, Mozzarella, cream sauce",
preorder:"Pre-order",
hotel:"Hotel Menu"
}
};

function setLang(lang){

document.getElementById('ruBtn').classList.remove('active');
document.getElementById('enBtn').classList.remove('active');

if(lang==='ru') document.getElementById('ruBtn').classList.add('active');
if(lang==='en') document.getElementById('enBtn').classList.add('active');

document.documentElement.lang = lang;

/* TEXT SWITCH */
document.querySelectorAll('[data-key]').forEach(el=>{
const key = el.getAttribute('data-key');
if(translations[lang][key]){
el.innerText = translations[lang][key];
}
});

/* search placeholder */
document.getElementById('search').placeholder = translations[lang].search;
}

</script>

</body>
</html>
