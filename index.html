<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENUA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#0a0a0a;
background-image:radial-gradient(circle at top,#2a2a2a 0%,#0a0a0a 60%);
color:#fff;
}

.header{
padding:40px 20px;
text-align:center;
position:relative;
background:rgba(10,10,10,.85);
border-bottom:1px solid rgba(241,209,154,.15);
}

#logo{
font-size:48px;
color:#f1d19a;
letter-spacing:5px;
}

.lang-switch{
position:absolute;
top:15px;
right:15px;
display:flex;
gap:8px;
}

.lang-switch button{
background:#1b1b1b;
border:none;
color:#fff;
padding:6px 10px;
border-radius:10px;
cursor:pointer;
}

.lang-switch button.active{
background:#f1d19a;
color:#111;
font-weight:bold;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.tab{
padding:12px 22px;
border:none;
border-radius:30px;
cursor:pointer;
background:#1b1b1b;
color:#fff;
}

.tab.active{
background:linear-gradient(135deg,#f1d19a,#c9a96e);
color:#111;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.menu{display:none}
.menu.active{display:block}

.category-title{
font-size:28px;
color:#f1d19a;
margin:30px 0 15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
}

.card{
position:relative;
background:rgba(255,255,255,.04);
border:1px solid rgba(241,209,154,.12);
border-radius:18px;
padding:15px;
overflow:hidden;
}

.name{font-weight:bold;font-size:18px}
.weight{font-size:12px;color:#f1d19a;margin-top:5px}

.price{
position:absolute;
top:12px;
right:12px;
background:rgba(241,209,154,.15);
border:1px solid rgba(241,209,154,.35);
color:#f1d19a;
padding:4px 8px;
border-radius:10px;
font-weight:bold;
font-size:13px;
}

.desc{color:#ccc;margin-top:10px;line-height:1.5}
</style>
</head>

<body>

<div class="header">

<div class="lang-switch">
<button id="ruBtn" class="active" onclick="setLang('ru')">RU</button>
<button id="enBtn" onclick="setLang('en')">EN</button>
</div>

<h1 id="logo"></h1>

<div class="tabs">
<button class="tab active" onclick="showMenu('lounge',this)"></button>
<button class="tab" onclick="showMenu('preorder',this)"></button>
<button class="tab" onclick="showMenu('hotel',this)"></button>
<button class="tab" onclick="showMenu('bar',this)"></button>
</div>

</div>

<div class="container">

<!-- LOUNGE -->
<div id="lounge" class="menu active">

<div class="category-title" data-cat="pizza"></div>
<div class="grid">

<div class="card" data-id="pizza4"><div class="name"></div><div class="weight">500 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="pizza_ham_mush"><div class="name"></div><div class="weight">620 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="margarita"><div class="name"></div><div class="weight">500 g</div><div class="price"></div><div class="desc"></div></div>

</div>

<div class="category-title" data-cat="burgers"></div>
<div class="grid">

<div class="card" data-id="burger"><div class="name"></div><div class="weight">275 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="sandwich"><div class="name"></div><div class="weight">150 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="fries"><div class="name"></div><div class="weight">120 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="rustic"><div class="name"></div><div class="weight">150 g</div><div class="price"></div><div class="desc"></div></div>

<div class="card" data-id="nuggets"><div class="name"></div><div class="weight">6 pcs</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="shrimp_tempura"><div class="name"></div><div class="weight">5 pcs</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="calamari"><div class="name"></div><div class="weight">7 pcs</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="wings"><div class="name"></div><div class="weight">4 pcs</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="croutons"><div class="name"></div><div class="weight">8 pcs</div><div class="price"></div><div class="desc"></div></div>

</div>

<div class="category-title" data-cat="salads"></div>
<div class="grid">

<div class="card" data-id="caesar_chicken"><div class="name"></div><div class="weight">220 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="caesar_salmon"><div class="name"></div><div class="weight">220 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="caesar_shrimp"><div class="name"></div><div class="weight">220 g</div><div class="price"></div><div class="desc"></div></div>

<div class="card" data-id="eggplant"><div class="name"></div><div class="weight">220 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="greek"><div class="name"></div><div class="weight">175 g</div><div class="price"></div><div class="desc"></div></div>

</div>

<div class="category-title" data-cat="pasta"></div>
<div class="grid">

<div class="card" data-id="carbonara"><div class="name"></div><div class="weight">245 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="fettuccine"><div class="name"></div><div class="weight">285 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="shrimp_pasta"><div class="name"></div><div class="weight">250 g</div><div class="price"></div><div class="desc"></div></div>

</div>

<div class="category-title" data-cat="sets"></div>
<div class="grid">

<div class="card" data-id="cheese_big"><div class="name"></div><div class="weight">370 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="cheese_small"><div class="name"></div><div class="weight">200 g</div><div class="price"></div><div class="desc"></div></div>

<div class="card" data-id="meat_big"><div class="name"></div><div class="weight">320 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="meat_small"><div class="name"></div><div class="weight">200 g</div><div class="price"></div><div class="desc"></div></div>

<div class="card" data-id="beer_set_garlic"><div class="name"></div><div class="weight">350 g</div><div class="price"></div><div class="desc"></div></div>
<div class="card" data-id="beer_set_shrimp"><div class="name"></div><div class="weight">850 g</div><div class="price"></div><div class="desc"></div></div>

</div>

</div>

<!-- PREORDER -->
<div id="preorder" class="menu"><h2></h2></div>

<!-- HOTEL -->
<div id="hotel" class="menu"><h2></h2></div>

<!-- BAR -->
<div id="bar" class="menu">

<div class="category-title" data-cat="bar"></div>

<div class="grid">

<div class="card" data-id="mojito">
<div class="name"></div>
<div class="weight">300 ml</div>
<div class="price"></div>
<div class="desc"></div>
</div>

<div class="card" data-id="espresso_martini">
<div class="name"></div>
<div class="weight">120 ml</div>
<div class="price"></div>
<div class="desc"></div>
</div>

<div class="card" data-id="whiskey_sour">
<div class="name"></div>
<div class="weight">200 ml</div>
<div class="price"></div>
<div class="desc"></div>
</div>

</div>
</div>

</div>

<script>

function showMenu(id,btn){
document.querySelectorAll('.menu').forEach(m=>m.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
btn.classList.add('active');
}

const ui = {
ru:{
logo:"MENUA Lounge Bar",
tabs:["Lounge Bar","По предзаказу","Hotel","Bar"],
cats:{
pizza:"🍕 Пицца",
burgers:"🍔 Бургеры и закуски",
salads:"🥗 Салаты",
pasta:"🍝 Паста",
sets:"🍺 Сеты",
bar:"🍸 Бар"
},
preorder:"По предзаказу",
hotel:"Меню гостиницы"
},
en:{
logo:"MENUA Lounge Bar",
tabs:["Lounge Bar","Pre-order","Hotel","Bar"],
cats:{
pizza:"🍕 Pizza",
burgers:"🍔 Burgers & Snacks",
salads:"🥗 Salads",
pasta:"🍝 Pasta",
sets:"🍺 Sets",
bar:"🍸 Bar"
},
preorder:"Pre-order",
hotel:"Hotel menu"
}
};

const menu = {
burger:{name:{ru:"Бургер",en:"Burger"},price:"350 ₽",desc:{ru:"Булочка, соус, салат, чеддер, говядина",en:"Bun, sauce, lettuce, cheddar, beef"}},
sandwich:{name:{ru:"Сэндвич",en:"Sandwich"},price:"250 ₽",desc:{ru:"Хлеб, сыр, ветчина",en:"Bread, cheese, ham"}},
fries:{name:{ru:"Картофель фри",en:"Fries"},price:"150 ₽",desc:{ru:"Картофель, специи",en:"Potatoes, spices"}},
rustic:{name:{ru:"Картофель по-деревенски",en:"Rustic potatoes"},price:"210 ₽",desc:{ru:"Картофель, специи",en:"Potatoes, spices"}},

pizza4:{name:{ru:"Пицца 4 сыра",en:"4 Cheese Pizza"},price:"600 ₽",desc:{ru:"4 сыра",en:"4 cheeses"}},
pizza_ham_mush:{name:{ru:"Ветчина-грибы",en:"Ham & Mushroom"},price:"600 ₽",desc:{ru:"Соус, сыр, ветчина, грибы",en:"Sauce, cheese, ham, mushrooms"}},
margarita:{name:{ru:"Маргарита",en:"Margherita"},price:"600 ₽",desc:{ru:"Помидоры, сыр",en:"Tomatoes, cheese"}},

carbonara:{name:{ru:"Карбонара",en:"Carbonara"},price:"420 ₽",desc:{ru:"Паста, бекон, сливки",en:"Pasta, bacon, cream"}},
fettuccine:{name:{ru:"Курица и грибы",en:"Chicken mushroom"},price:"450 ₽",desc:{ru:"Паста, курица, грибы",en:"Pasta, chicken, mushrooms"}},
shrimp_pasta:{name:{ru:"Морепродукты",en:"Seafood pasta"},price:"550 ₽",desc:{ru:"Креветки, соус",en:"Shrimp, sauce"}},

cheese_big:{name:{ru:"Сырная нарезка большая",en:"Cheese platter big"},price:"850 ₽",desc:{ru:"Сыры",en:"Cheeses"}},
cheese_small:{name:{ru:"Сырная нарезка малая",en:"Cheese platter small"},price:"580 ₽",desc:{ru:"Сыры",en:"Cheeses"}},

meat_big:{name:{ru:"Мясная нарезка большая",en:"Meat platter big"},price:"950 ₽",desc:{ru:"Мясо",en:"Meat"}},
meat_small:{name:{ru:"Мясная нарезка малая",en:"Meat platter small"},price:"650 ₽",desc:{ru:"Мясо",en:"Meat"}},

shrimp_tempura:{name:{ru:"Креветки в кляре",en:"Shrimp tempura"},price:"550 ₽",desc:{ru:"5 шт",en:"5 pcs"}},
nuggets:{name:{ru:"Наггетсы",en:"Nuggets"},price:"250 ₽",desc:{ru:"6 шт",en:"6 pcs"}},
calamari:{name:{ru:"Кольца кальмара",en:"Calamari rings"},price:"350 ₽",desc:{ru:"7 шт",en:"7 pcs"}},
wings:{name:{ru:"Крылья BBQ",en:"BBQ wings"},price:"350 ₽",desc:{ru:"4 шт",en:"4 pcs"}},
croutons:{name:{ru:"Гренки",en:"Croutons"},price:"190 ₽",desc:{ru:"8 шт",en:"8 pcs"}},

caesar_chicken:{name:{ru:"Цезарь с курицей",en:"Chicken Caesar"},price:"450 ₽",desc:{ru:"Салат",en:"Salad"}},
caesar_salmon:{name:{ru:"Цезарь с семгой",en:"Salmon Caesar"},price:"750 ₽",desc:{ru:"Салат",en:"Salad"}},
caesar_shrimp:{name:{ru:"Цезарь с креветками",en:"Shrimp Caesar"},price:"800 ₽",desc:{ru:"Салат",en:"Salad"}},

eggplant:{name:{ru:"Баклажаны",en:"Eggplant"},price:"350 ₽",desc:{ru:"Баклажан",en:"Eggplant"}},
greek:{name:{ru:"Греческий",en:"Greek salad"},price:"300 ₽",desc:{ru:"Овощи",en:"Vegetables"}},

beer_set_garlic:{name:{ru:"Пивной сет чесночный",en:"Beer set garlic"},price:"1050 ₽",desc:{ru:"Сет",en:"Set"}},
beer_set_shrimp:{name:{ru:"Пивной сет с креветками",en:"Beer set shrimp"},price:"1650 ₽",desc:{ru:"Сет",en:"Set"}},

mojito:{name:{ru:"Мохито",en:"Mojito"},price:"450 ₽",desc:{ru:"Ром, мята, лайм",en:"Rum, mint, lime"}},
espresso_martini:{name:{ru:"Эспрессо мартини",en:"Espresso Martini"},price:"600 ₽",desc:{ru:"Кофе, водка",en:"Coffee, vodka"}},
whiskey_sour:{name:{ru:"Виски сауэр",en:"Whiskey Sour"},price:"550 ₽",desc:{ru:"Виски, лимон",en:"Whiskey, lemon"}}
};

function setLang(lang){

document.getElementById('logo').textContent = ui[lang].logo;

document.querySelectorAll('.tab')[0].textContent = ui[lang].tabs[0];
document.querySelectorAll('.tab')[1].textContent = ui[lang].tabs[1];
document.querySelectorAll('.tab')[2].textContent = ui[lang].tabs[2];
document.querySelectorAll('.tab')[3].textContent = ui[lang].tabs[3];

document.querySelector('[data-cat="pizza"]').textContent = ui[lang].cats.pizza;
document.querySelector('[data-cat="burgers"]').textContent = ui[lang].cats.burgers;
document.querySelector('[data-cat="salads"]').textContent = ui[lang].cats.salads;
document.querySelector('[data-cat="pasta"]').textContent = ui[lang].cats.pasta;
document.querySelector('[data-cat="sets"]').textContent = ui[lang].cats.sets;
document.querySelector('[data-cat="bar"]').textContent = ui[lang].cats.bar;

document.querySelectorAll('.card').forEach(card=>{
const id = card.dataset.id;
if(menu[id]){
card.querySelector('.name').textContent = menu[id].name[lang];
card.querySelector('.desc').textContent = menu[id].desc[lang];
card.querySelector('.price').textContent = menu[id].price;
}
});

document.getElementById('ruBtn').classList.toggle('active',lang==='ru');
document.getElementById('enBtn').classList.toggle('active',lang==='en');
}

setLang('ru');

</script>

</body>
</html>
