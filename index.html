<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#0a0a0a;
background-image:radial-gradient(circle at top,#2a2a2a 0%,#0a0a0a 60%);
color:#fff;
}

.header{
padding:40px 20px;
text-align:center;
position:relative;
background:rgba(10,10,10,.85);
border-bottom:1px solid rgba(241,209,154,.15);
}

#logo{
font-size:48px;
color:#f1d19a;
letter-spacing:5px;
}

.lang-switch{
position:absolute;
top:15px;
right:15px;
display:flex;
gap:8px;
}

.lang-switch button{
background:#1b1b1b;
border:none;
color:#fff;
padding:6px 10px;
border-radius:10px;
cursor:pointer;
}

.lang-switch button.active{
background:#f1d19a;
color:#111;
font-weight:bold;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.tab{
padding:12px 22px;
border:none;
border-radius:30px;
cursor:pointer;
background:#1b1b1b;
color:#fff;
}

.tab.active{
background:linear-gradient(135deg,#f1d19a,#c9a96e);
color:#111;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.menu{display:none}
.menu.active{display:block}

.category-title{
font-size:28px;
color:#f1d19a;
margin:30px 0 15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
}

.card{
position:relative;
background:rgba(255,255,255,.04);
border:1px solid rgba(241,209,154,.12);
border-radius:18px;
padding:15px;
overflow:hidden;
}

.name{font-weight:bold;font-size:18px}
.weight{font-size:12px;color:#f1d19a;margin-top:5px}

.price{
position:absolute;
top:12px;
right:12px;
background:rgba(241,209,154,.15);
border:1px solid rgba(241,209,154,.35);
color:#f1d19a;
padding:4px 8px;
border-radius:10px;
font-weight:bold;
font-size:13px;
}

.desc{color:#ccc;margin-top:10px;line-height:1.5}
</style>
</head>

const id = card.dataset.id;
if(menu[id]){
card.querySelector('.name').textContent = menu[id].name[lang];
card.querySelector('.desc').textContent = menu[id].desc[lang];
card.querySelector('.price').textContent = menu[id].price;
}
});

document.getElementById('enBtn').classList.toggle('active',lang==='en');
}
